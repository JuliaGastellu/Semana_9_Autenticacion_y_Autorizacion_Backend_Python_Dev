[project]
name = "pulse-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115,<0.116",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "alembic>=1.13,<2",
  "pydantic-settings>=2.5,<3",
  "pwdlib[argon2,bcrypt]>=0.2,<1",
  "pyjwt>=2.9,<3",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "mypy>=1.13,<2"]

